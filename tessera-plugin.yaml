id: bambulab_x1c
version: 0.4.0
api: "0.15"
icon: printer-3d
maintainer: bernddegen
license: MIT
stage: beta
topics: [tech, home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 8

inputs:
  - id: prefix
    kind: text
    label: drucker_prefix
    hint: drucker_prefix_hint

tiles:
  - id: printer_status
    name: tile_printer_status_name
    icon: printer-3d
    sizes: { min: 1x1, max: 4x2 }
    memory: 2000
    example: tile_printer_status_example

  - id: printer_temps
    name: tile_printer_temps_name
    icon: thermometer
    sizes: { min: 1x1, max: 2x2 }
    memory: 1200
    example: tile_printer_temps_example
